<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صورة OG - مجَلّتكم</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f4c81;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0f4c81 0%, #0b3b66 40%, #f59e0b 100%);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .og-card::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }

    .og-card::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      background: rgba(255,255,255,0.03);
      border-radius: 50%;
    }

    .og-logo {
      font-size: 5rem;
      font-weight: 900;
      color: white;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .og-logo .mark {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f59e0b, #ffdd57);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #0f4c81;
      font-weight: 900;
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
    }

    .og-title {
      font-size: 3.5rem;
      font-weight: 900;
      color: white;
      text-align: center;
      margin: 15px 0;
      position: relative;
      z-index: 1;
      line-height: 1.3;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .og-title span {
      color: #f59e0b;
    }

    .og-description {
      font-size: 1.4rem;
      color: rgba(255,255,255,0.85);
      text-align: center;
      max-width: 700px;
      position: relative;
      z-index: 1;
      line-height: 1.8;
      margin-top: 10px;
    }

    .og-divider {
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #f59e0b, transparent);
      border-radius: 4px;
      margin: 15px 0;
      position: relative;
      z-index: 1;
    }

    .og-footer {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .og-footer .icon {
      font-size: 1.8rem;
      color: rgba(255,255,255,0.5);
    }

    .og-footer .text {
      color: rgba(255,255,255,0.6);
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .og-url {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 2px;
      z-index: 1;
    }

    .og-pattern {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.03) 0%, transparent 50%);
      z-index: 0;
    }
  </style>
</head>
<body>

  <div class="og-card">
    <div class="og-pattern"></div>

    <div class="og-logo">
      <div class="mark">م</div>
      <span>مجَلّتكم</span>
    </div>

    <div class="og-title">
      مجلة عربية <span>حديثة</span>
    </div>

    <div class="og-divider"></div>

    <div class="og-description">
      السياسة · الاقتصاد · التكنولوجيا · المجتمع · الرياضة · العالم
    </div>

    <div class="og-footer">
      <span class="icon">📰</span>
      <span class="text">آخر الأخبار والمقالات</span>
      <span class="icon">📚</span>
      <span class="text">تحليلات عميقة</span>
    </div>

    <div class="og-url">majalati.com</div>
  </div>

</body>
</html>
